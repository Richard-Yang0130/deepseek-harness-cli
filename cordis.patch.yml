# Standalone terminal surface over the public @deepseek-ai/dsh-base bundle.
- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'
    - id: storage
      name: '@deepseek-ai/dsh-storage'
    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')
    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json
    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
    - id: tui-startup
      name: 'deepseek-harness-cli/startup'
    - id: tui-runner
      name: 'deepseek-harness-cli'
      inject: [tuiStartup]
      config:
        resume: !!js ctx.tuiStartup.resume
        prompt: !!js ctx.tuiStartup.prompt

# Match Web's agent-plane boundary: the selected preset owns these capabilities.
